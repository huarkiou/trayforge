[project]
name = "trayforge"
version = "0.1.0"
description = "Windows system tray controller for NapCat QQ and AstrBot"
requires-python = ">=3.11"
dependencies = [
    "pystray>=0.19.0",
    "Pillow>=10.0.0",
    "pyinstaller>=6.0.0",
    "psutil>=7.2.2",
    "pygobject>=3.56.0; sys_platform == 'linux'",
]

[tool.pyright]
typeCheckingMode = "basic"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.12.0",
    "ty>=0.0.42",
    "types-psutil>=7.2.2.20260518",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
